<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seif Spitan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d0e11;
      color: #f3f4f6;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 400px;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .subtitle {
      font-size: 1rem;
      color: #9ca3af;
      margin-bottom: 24px;
    }

    .mockup-badge {
      display: inline-block;
      border: 1px dashed #2d313c;
      background: #14161c;
      color: #6b7280;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 32px;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .links a {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.15s ease;
    }

    .links a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Seif Spitan</h1>
    <p class="subtitle">Software Engineer</p>

    <div class="mockup-badge">
      Portfolio Mockup &bull; Coming Soon
    </div>

    <div class="links">
      <a href="https://github.com/seifspitan1" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:spitan6@gmail.com">Email</a>
    </div>
  </main>
</body>
</html>
