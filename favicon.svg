<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Chevron Gradient (Cyan / Sky Blue) -->
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Slash Gradient (Cyan to Purple) -->
    <linearGradient id="slashGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Right Chevron Gradient (Purple / Magenta) -->
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#E040FB"/>
    </linearGradient>

    <!-- Dark Circular Aura matching user's photo -->
    <radialGradient id="darkAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#05060b" stop-opacity="1"/>
      <stop offset="68%" stop-color="#070810" stop-opacity="0.96"/>
      <stop offset="84%" stop-color="#0b0d18" stop-opacity="0.75"/>
      <stop offset="95%" stop-color="#0b0d18" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0d18" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Color Aura inside circle -->
    <radialGradient id="colorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0072FF" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow on glyphs -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Dark Background matching photo -->
  <circle cx="256" cy="256" r="236" fill="url(#darkAura)"/>
  <!-- Ambient Color Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#colorGlow)"/>

  <!-- Code Glyphs with bold legibility -->
  <g filter="url(#softGlow)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left chevron < -->
    <path d="M 180 156 L 92 256 L 180 356" stroke="url(#leftGrad)"/>
    <!-- Center slash / -->
    <line x1="288" y1="138" x2="224" y2="374" stroke="url(#slashGrad)"/>
    <!-- Right chevron > -->
    <path d="M 332 156 L 420 256 L 332 356" stroke="url(#rightGrad)"/>
  </g>
</svg>